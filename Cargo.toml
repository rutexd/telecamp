[package]
name = "telecamp"
version = "0.1.0"
edition = "2024"
default-run = "telecamp"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
env_logger = "0.11"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
impersonate-rs = { git = "https://github.com/rutexd/impersonate-rs", rev = "b2c703194c7be86a6ab81c0ae8c1fe6adbb2f1d3" }
log = "0.4"
percent-encoding = "2"
grammers-client = "0.10"
grammers-session = { version = "0.10", default-features = false, features = ["serde"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
